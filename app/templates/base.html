<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spice &amp; Slice{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('shop.menu') }}">Spice &amp; Slice</a>
    <nav>
      <a href="{{ url_for('shop.menu') }}">Menu</a>
      <a href="{{ url_for('shop.cart') }}">Your order{% if cart_count %} ({{ cart_count }}){% endif %}</a>
      <a href="{{ url_for('shop.kitchen') }}">Kitchen</a>
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
